


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zirra AI</title>
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #000000;
      --bg-dark: #121212;
      --text-dark: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      height: calc(var(--vh, 1vh) * 100);
      transition: background 0.3s, color 0.3s;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    header {
      text-align: center;
      margin: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .toggle-btn {
      margin-top: 10px;
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid currentColor;
      border-radius: 6px;
      background: transparent;
    }

    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
      width: 100%;
      max-width: 800px;
    }

    .bot-card {
      background: inherit;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .bot-card:hover {
      transform: scale(1.05);
    }

    .bot-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .chat-container {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 800px;
    }

    .chat-header {
      padding: 10px;
      border-bottom: 1px solid currentColor;
      text-align: center;
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid currentColor;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chat-input button {
      padding: 10px;
      border: none;
      background: currentColor;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chat with AIs that feel alive.</h1>
    <button id="toggle-theme" class="toggle-btn">Toggle Dark/Light</button>
  </header>

  <div class="bot-grid">
    <div class="bot-card" data-bot="rex">
      <img src="https://via.placeholder.com/150" alt="Rex" />
      <div>Rex</div>
    </div>
    <div class="bot-card" data-bot="luna">
      <img src="https://via.placeholder.com/150" alt="Luna" />
      <div>Luna</div>
    </div>
    <div class="bot-card" data-bot="nova">
      <img src="https://via.placeholder.com/150" alt="Nova" />
      <div>Nova</div>
    </div>
    <div class="bot-card" data-bot="atlas">
      <img src="https://via.placeholder.com/150" alt="Atlas" />
      <div>Atlas</div>
    </div>
    <div class="bot-card" data-bot="zen">
      <img src="https://via.placeholder.com/150" alt="Zen" />
      <div>Zen</div>
    </div>
    <div class="bot-card" data-bot="echo">
      <img src="https://via.placeholder.com/150" alt="Echo" />
      <div>Echo</div>
    </div>
  </div>

  <div class="chat-container" id="chat-container">
    <div class="chat-header" id="chat-header"></div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("toggle-theme");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    const botCards = document.querySelectorAll(".bot-card");
    const chatContainer = document.getElementById("chat-container");
    const chatHeader = document.getElementById("chat-header");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    let currentBot = null;

    // store history for each bot
    let chatHistories = {
      rex: [],
      luna: [],
      nova: [],
      atlas: [],
      zen: [],
      echo: []
    };

    botCards.forEach(card => {
      card.addEventListener("click", () => {
        currentBot = card.dataset.bot;
        chatHeader.textContent = "Chatting with " + currentBot;
        document.querySelector(".bot-grid").style.display = "none";
        chatContainer.style.display = "flex";
        renderChat(currentBot);
      });
    });

    sendBtn.addEventListener("click", () => {
      const msg = chatInput.value.trim();
      if (!msg) return;
      appendMessage("user", msg);
      chatInput.value = "";
      sendChat(msg);
    });

    function appendMessage(sender, text, isMarkdown = false) {
      const msgDiv = document.createElement("div");
      msgDiv.textContent = (sender === "user" ? "You: " : "AI: ") + text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      saveMessage(currentBot, { sender, text, isMarkdown });
    }

    function saveMessage(bot, msg) {
      chatHistories[bot].push(msg);
    }

    function renderChat(bot) {
      chatMessages.innerHTML = "";
      chatHistories[bot].forEach(m =>
        appendMessage(m.sender, m.text, m.isMarkdown)
      );
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    async function sendChat(userInput) {
      try {
        const historyPayload = chatHistories[currentBot] || [];

        const res = await fetch("https://brandice.xyz/chat/" + currentBot, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_input: userInput,
            history: historyPayload
          })
        });

        console.log("Status:", res.status);
        const raw = await res.text();
        console.log("Raw response:", raw);

        removeTypingIndicator();

        if (!res.ok) {
          appendMessage("ai", `Server error (${res.status})`);
          return;
        }

        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          appendMessage("ai", "Invalid JSON from server: " + raw);
          return;
        }

        if (data.reply) {
          appendMessage("ai", data.reply, true);
        }

        if (Array.isArray(data.history)) {
          chatHistories[currentBot] = data.history;
          renderChat(currentBot);
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessage("ai", "Oops! Something went wrong. " + err.message);
        console.error("Error details:", err);
      }
    }
  </script>
</body>
</html>
