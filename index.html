  <title>Botiverse</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{

      --bg: #f5f5f5;
      --text: #333333;
      --card-bg: #ffffff;
      --card-text: #333333;
      --header-bg: #4a90e2;
      --header-text: #ffffff;
      --user-bg: #dcf8c6;
      --bot-bg: #ffffff;
      --input-bg: #ffffff;
      --border: #cccccc;
      --accent: #4a90e2;
      --muted: #888888;
    }

    body.dark{
      --bg: #0f1720;
      --text: #e6eef8;
      --card-bg: #0b1220;
      --card-text: #e6eef8;
      --header-bg: #0b1220;
      --header-text: #e6eef8;
      --user-bg: #054d3a;
      --bot-bg: #1e1e1e;
      --input-bg: #071025;
      --border: #263142;
      --accent: #2b86d9;
      --muted: #9aa6b2;
    }

    html,body{
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      transition: background .25s ease, color .25s ease;
    }

    /* Global theme toggle (always visible top-right) */
    #theme-toggle {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 10010;
      background: var(--header-bg);
      color: var(--header-text);
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      font-size: 16px;
    }

    /* Home page */
    #home-container{
      padding: 30px;
      text-align: center;
      min-height: calc(100vh - 40px);
      box-sizing: border-box;
    }

    #home-container h1{
      font-size: 2rem;
      margin: 0 0 24px 0;
      color: var(--text);
    }

    #home{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      text-align: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .card-title {
      margin-top: 10px;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--card-text);
    }

    /* Chat UI */
    #chat-section {
      display: none;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 1rem;
      font-size: 1.25rem;
      position: relative;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
    }

    .message {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      line-height: 1.4;
      font-size: 1rem;
      word-wrap: break-word;
      color: var(--text);
    }

    .user {
      align-self: flex-end;
      background-color: var(--user-bg);
      border-bottom-right-radius: 0;
      color: var(--card-text);
    }

    .ai {
      align-self: flex-start;
      background-color: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0;
      color: var(--text);
    }

    .typing {
      align-self: flex-start;
      font-style: italic;
      color: var(--muted);
      padding: 0.5rem 1rem;
      background-color: var(--input-bg);
      border-radius: 15px;
    }

    form {
      display: flex;
      padding: 10px;
      background: var(--input-bg);
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      min-height: 44px;
    }

    button.send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Splash */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--header-bg), #81d4fa);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.75rem;
      z-index: 9999;
      flex-direction: column;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin-top: 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      #home-container { padding: 18px; }
      .card img { height: 110px; }
      header { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <!-- Global theme toggle (always visible) -->
  <button id="theme-toggle" aria-label="Toggle theme">🌙</button>

  <!-- HOME PAGE -->
  <div id="home-container">
    <h1>Chat with AIs that feel alive.</h1>
    <div id="home">
      <div class="card" data-bot="rex">
        <img src="https://via.placeholder.com/400x220?text=Rex" alt="Rex AI">
        <div class="card-title">Rex AI</div>
      </div>
      <div class="card" data-bot="nova">
        <img src="https://via.placeholder.com/400x220?text=Nova" alt="Nova AI">
        <div class="card-title">Nova AI</div>
      </div>
      <div class="card" data-bot="luna">
        <img src="https://via.placeholder.com/400x220?text=Luna" alt="Luna AI">
        <div class="card-title">Luna AI</div>
      </div>
      <div class="card" data-bot="atlas">
        <img src="https://via.placeholder.com/400x220?text=Atlas" alt="Atlas AI">
        <div class="card-title">Atlas AI</div>
      </div>
      <div class="card" data-bot="zen">
        <img src="https://via.placeholder.com/400x220?text=Zen" alt="Zen AI">
        <div class="card-title">Zen AI</div>
      </div>
      <div class="card" data-bot="echo">
        <img src="https://via.placeholder.com/400x220?text=Echo" alt="Echo AI">
        <div class="card-title">Echo AI</div>
      </div>
    </div>
  </div>

  <!-- CHAT PAGE -->
  <div id="chat-section">
    <div id="splash" class="hidden">
      <div>Loading chatbot...</div>
      <div class="spinner"></div>
    </div>

    <header>
      <span id="chat-title">💬 Rex AI</span>
    </header>

    <div id="chat-box"></div>

    <form id="chat-form">
      <textarea placeholder="Type a message..." required></textarea>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <script>
    // DOM
    const themeToggle = document.getElementById('theme-toggle');
    const homeContainer = document.getElementById('home-container');
    const chatSection = document.getElementById('chat-section');
    const splash = document.getElementById('splash');
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const textarea = form.querySelector('textarea');
    const chatTitle = document.getElementById('chat-title');

    // Chat state
    let typingIndicator = null;
    let chatHistory = [];
    let currentBot = 'rex';

    const botConfigs = {
      rex:   { name: "Rex AI",   endpoint: "https://brandice.xyz/chat/rex" },
      nova:  { name: "Nova AI",  endpoint: "https://brandice.xyz/chat/nova" },
      luna:  { name: "Luna AI",  endpoint: "https://brandice.xyz/chat/luna" },
      atlas: { name: "Atlas AI", endpoint: "https://brandice.xyz/chat/atlas" },
      zen:   { name: "Zen AI",   endpoint: "https://brandice.xyz/chat/zen" },
      echo:  { name: "Echo AI",  endpoint: "https://brandice.xyz/chat/echo" }
    };

    /* -------------------------
       Theme toggle (persist)
       -------------------------*/
    function applySavedTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') document.body.classList.add('dark');
      themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
    applySavedTheme();

    themeToggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    /* -------------------------
       Routing & card click
       -------------------------*/
    function showPage() {
      const path = location.pathname;
      if (path.startsWith('/chatbot/')) {
        const bot = path.split('/').pop() || 'rex';
        if (botConfigs[bot]) currentBot = bot;
        setupChatFor(currentBot);
        homeContainer.style.display = 'none';
        chatSection.style.display = 'flex';
        splash.classList.remove('hidden');
        setTimeout(() => splash.classList.add('hidden'), 1100);
      } else {
        homeContainer.style.display = 'block';
        chatSection.style.display = 'none';
      }
    }

    function setupChatFor(botKey) {
      const cfg = botConfigs[botKey] || botConfigs.rex;
      chatTitle.textContent = "💬 " + cfg.name;
      chatHistory = [];
      chatBox.innerHTML = '';
    }

    // card click -> navigate
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const bot = card.dataset.bot || 'rex';
        history.pushState({}, '', '/chatbot/' + bot);
        showPage();
      });
    });

    window.addEventListener('popstate', showPage);
    showPage();

    /* -------------------------
       Chat helpers
       -------------------------*/
    function appendMessage(role, text, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerHTML = isMarkdown ? marked.parse(text) : text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTypingIndicator() {
      if (typingIndicator) return;
      typingIndicator = document.createElement('div');
      typingIndicator.className = 'typing';
      typingIndicator.textContent = (botConfigs[currentBot]?.name || 'AI') + ' is typing...';
      chatBox.appendChild(typingIndicator);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
      if (typingIndicator) {
        chatBox.removeChild(typingIndicator);
        typingIndicator = null;
      }
    }

    async function waitUntilReady(){
      try {
        const res = await fetch('https://brandice.xyz/waiting');
        const data = await res.json();
        return data.status === 'ready';
      } catch {
        return false;
      }
    }

    async function sendChat(userInput){
      const cfg = botConfigs[currentBot] || botConfigs.rex;
      try {
        const res = await fetch(cfg.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_input: userInput, history: chatHistory })
        });
        const data = await res.json();
        removeTypingIndicator();
        if (res.status === 429) {
          appendMessage('ai', 'Server is busy. Please try again later.');
          return;
        }
        appendMessage('ai', data.reply, true);
        chatHistory = data.history;
      } catch (err) {
        removeTypingIndicator();
        appendMessage('ai', 'Oops! Something went wrong.');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userInput = textarea.value.trim();
      if (!userInput) return;

      appendMessage('user', userInput);
      textarea.value = '';
      setTimeout(() => showTypingIndicator(), 300);
      const ready = await waitUntilReady();
      if (ready) await sendChat(userInput);
      else {
        removeTypingIndicator();
        appendMessage('ai', 'Server is busy. Please try again later.');
      }
    });
  </script>
</body>
</html>

        chatBox.removeChild(typingIndicator);
        typingIndicator = null;
      }
    }

    async function waitUntilReady() {

      const delayMs = 3000; // 3 seconds

      for (let i = 0; i < maxRetries; i++) {
        try {
          const res = await fetch("https://kwsdjcsmdsdhsfsdksaddkizsd.onrender.com/waiting");
          const data = await res.json();
          if (data.status === "ready") {
            return true;
          }
        } catch {
          // ignore errors and retry
        }
        await new Promise(r => setTimeout(r, delayMs));
      }
      return false;
    }

    async function sendChat(userInput) {
      showTypingIndicator();
      try {
        const res = await fetch("https://kwsdjcsmdsdhsfsdksaddkizsd.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_input: userInput,
            history: chatHistory
          })
        });

        const data = await res.json();
        removeTypingIndicator();

        if (res.status === 429) {
          appendMessage("ai", "Server is busy. Please try again later.");
          return;
        }

        appendMessage("ai", data.reply, true);
        chatHistory = data.history;
      } catch (err) {
        removeTypingIndicator();
        appendMessage("ai", "Oops! Something went wrong.", false);
      }
    }

    form.addEventListener("submit", async (e) => {

      textarea.value = "";

      // Wait for server readiness before chatting
      const ready = await waitUntilReady();
      if (ready) {
        await sendChat(userInput);
      } else {
        appendMessage("ai", "Server is busy. Please try again later.");
      }
    });
